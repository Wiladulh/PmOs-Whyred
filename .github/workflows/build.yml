name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install System Dependencies & pmbootstrap via Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip util-linux coreutils binfmt-support qemu-user-static
          
          # VALIDASI 1: Menggunakan URL Git resmi terbaru dari dokumentasi Nura/postmarketOS
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          
          # VALIDASI 2: Membuat direktori bin lokal dan mendaftarkan symlink sesuai standar instalasi terbaru
          mkdir -p ~/.local/bin
          sudo ln -s ~/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap

      - name: Initialize pmbootstrap (Non-Interactive Headless)
        run: |
          # VALIDASI 3: Menghapus piping "yes" interaktif yang bisa merusak konfigurasi target
          # VALIDASI 4: Menggunakan --ui=none sesuai arsitektur terbaru (bukan --interface none)
          pmbootstrap init \
            --work-path=/home/runner/pmbootstrap-work \
            --channel=edge \
            --vendor=xiaomi \
            --device=whyred \
            --ui=none \
            --username=giebux \
            --timezone=Asia/Jakarta

      - name: Configure Extra Packages
        run: |
          # Memasukkan NetworkManager untuk mengelola wlan0 & USB RNDIS (172.16.42.1) secara headless
          pmbootstrap config extra_packages "openssh,networkmanager,wpa_supplicant,iw,util-linux"

      - name: Inject Wi-Fi Configuration
        run: |
          CHROOT_NM_DIR="/home/runner/pmbootstrap-work/chroot_rootfs_xiaomi-whyred/etc/NetworkManager/system-connections"
          sudo mkdir -p "$CHROOT_NM_DIR"
          
          # Menyuntikkan credential Wi-Fi target langsung ke dalam rootfs sebelum dikompilasi
          sudo tee "$CHROOT_NM_DIR/fh_25f618.nmconnection" > /dev/null << 'EOF'
          [connection]
          id=fh_25f618
          uuid=a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
          type=wifi
          interface-name=wlan0

          [wifi]
          mode=infrastructure
          ssid=fh_25f618

          [wifi-security]
          auth-alg=open
          key-mgmt=wpa-psk
          psk=11223344

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          sudo chmod 600 "$CHROOT_NM_DIR/fh_25f618.nmconnection"

      - name: Install Image Target
        run: |
          # VALIDASI 5: 'pmbootstrap install' otomatis membangun kompilasi rootfs dan kernel tanpa butuh perintah build terpisah
          pmbootstrap install --password=1234 --no-fstab

      - name: Export Output Files
        run: |
          mkdir -p output
          # VALIDASI 6: Mengekspor target citra img ke direktori runner eksternal agar aman dari perubahan chroot internal
          pmbootstrap export /home/runner/work-export
          cp -r /home/runner/work-export/* output/ || true
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
            name: pmos-whyred-headless-server
            path: output/*
