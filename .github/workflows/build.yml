name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install System Dependencies & pmbootstrap via Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openssl util-linux coreutils binfmt-support qemu-user-static openssh-client
          
          # Clones directly from the modern, active self-hosted GitLab infrastructure
          git clone --depth=1 https://postmarketos.org ~/pmbootstrap
          sudo ln -s ~/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Pre-clone Official Pmaports Locally
        run: |
          # Clones the build recipes to a local directory, entirely bypassing the broken legacy fallback URLs
          git clone --depth=1 https://postmarketos.org ~/pmaports

      - name: Inject Valid Configuration File (Bypass pmbootstrap init)
        run: |
          mkdir -p ~/.config
          cat << 'EOF' > ~/.config/pmbootstrap.cfg
          [pmbootstrap]
          work = /home/runner/pmbootstrap-work
          client_version = 3.0.0
          jobs = 4
          channel = edge
          device = xiaomi-whyred
          vendor = xiaomi
          ui = none
          user = giebux
          timezone = Asia/Jakarta
          extra_packages = openssh,networkmanager,wpa_supplicant,iw,util-linux
          mirrors_alpine = http://dl-cdn.alpinelinux.org/alpine/
          aports = /home/runner/pmaports
          EOF

      - name: Inject Wi-Fi Configuration Into Target Rootfs
        run: |
          CHROOT_NM_DIR="/home/runner/pmbootstrap-work/chroot_rootfs_xiaomi-whyred/etc/NetworkManager/system-connections"
          sudo mkdir -p "$CHROOT_NM_DIR"
          
          # Injects your home Wi-Fi profile directly into the system image skeleton
          sudo tee "$CHROOT_NM_DIR/fh_25f618.nmconnection" > /dev/null << 'EOF'
          [connection]
          id=fh_25f618
          uuid=a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
          type=wifi
          interface-name=wlan0

          [wifi]
          mode=infrastructure
          ssid=fh_25f618

          [wifi-security]
          auth-alg=open
          key-mgmt=wpa-psk
          psk=11223344

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          # Applies the mandatory secure 600 file permissions required by Linux systems
          sudo chmod 600 "$CHROOT_NM_DIR/fh_25f618.nmconnection"

      - name: Compile and Install Image Target
        env:
          # Enforces offline execution mode to prevent legacy remote repository connection timeouts
          PMBOOTSTRAP_OFFLINE: "1"
        run: |
          # Executes the automated rootfs assembly process using the pre-cloned local aports database
          pmbootstrap --aports /home/runner/pmaports install --password=1234 --no-fstab

      - name: Export Output Files
        run: |
          mkdir -p output
          pmbootstrap --aports /home/runner/pmaports export /home/runner/work-export
          cp -r /home/runner/work-export/* output/ || true
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
            name: pmos-whyred-headless-server
            path: output/*
