name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 03. CLEAN RUNNER
      # ============================================================
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean

          echo "=== DISK ==="
          df -h

      # ============================================================
      # 04. HOST DEPENDENCIES
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            util-linux \
            coreutils \
            kpartx \
            binfmt-support \
            qemu-user-static \
            openssh-client

          echo "=== DEPENDENCIES ==="
          git --version
          python3 --version
          openssl version
          losetup --version
          command -v kpartx

          echo "=== DEPENDENCY CHECK: PASS ==="

      # ============================================================
      # 05. PMBOOTSTRAP
      # ============================================================
      - name: Install Latest pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketOS.org/postMarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "=== PMBOOTSTRAP ==="
          pmbootstrap --version

      # ============================================================
      # 06. PMAPORTS
      # ============================================================
      - name: Clone Official pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketOS.org/postMarketOS/pmaports.git \
            "$HOME/pmaports"

          echo "=== PMAPORTS ==="
          git -C "$HOME/pmaports" branch --show-current

          echo
          echo "=== WHYRED DEVICE CHECK ==="

          if [ ! -d "$HOME/pmaports/device/testing/device-xiaomi-whyred" ]; then
            echo "ERROR: device-xiaomi-whyred not found."

            find "$HOME/pmaports/device" \
              -maxdepth 3 \
              -type d \
              -name '*whyred*' \
              -print

            exit 1
          fi

          echo "PASS: device-xiaomi-whyred exists."

      # ============================================================
      # 07. PMBOOTSTRAP INIT
      # ============================================================
      - name: Initialize pmbootstrap
        run: |
          PMB_WORK="$HOME/pmbootstrap-work"
          PMB_APORTS="$HOME/pmaports"

          mkdir -p "$PMB_WORK"

          echo "=== PMBOOTSTRAP INIT ==="
          echo "WORK:   $PMB_WORK"
          echo "APORTS: $PMB_APORTS"

          test -d "$PMB_APORTS"
          test -d "$PMB_APORTS/device/testing/device-xiaomi-whyred"

          cd "$HOME"

          yes "" | pmbootstrap \
            --work "$PMB_WORK" \
            --aports "$PMB_APORTS" \
            init

          echo
          echo "=== PMBOOTSTRAP INIT: PASS ==="

      # ============================================================
      # 08. PMBOOTSTRAP CONFIGURATION
      # ============================================================
      - name: Configure pmbootstrap
        run: |
          PMB_WORK="$HOME/pmbootstrap-work"
          PMB_APORTS="$HOME/pmaports"

          pmbootstrap config work "$PMB_WORK"
          pmbootstrap config aports "$PMB_APORTS"

          pmbootstrap config device xiaomi-whyred
          pmbootstrap config ui console
          pmbootstrap config user giebux
          pmbootstrap config hostname whyred-server
          pmbootstrap config timezone Asia/Jakarta
          pmbootstrap config jobs 4

          pmbootstrap config extra_packages \
            "openssh,networkmanager,wpa_supplicant,iw,util-linux,usbutils,curl"

          pmbootstrap config ssh_keys False

          echo
          echo "=== PMBOOTSTRAP CONFIG ==="
          pmbootstrap config

          echo
          echo "=== CONFIGURATION: PASS ==="

      # ============================================================
      # 09. BUILD ROOTFS ONLY
      # ============================================================
      - name: Build Rootfs
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab \
            --no-image

          echo
          echo "=== ROOTFS BUILD: PASS ==="

      # ============================================================
      # 10. CONFIGURE WIFI
      # ============================================================
      - name: Configure Wi-Fi
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"

          if [ ! -d "$ROOTFS" ]; then
            echo "ERROR: rootfs not found:"
            echo "$ROOTFS"
            exit 1
          fi

          WIFI_DIR="$ROOTFS/etc/NetworkManager/system-connections"

          sudo mkdir -p "$WIFI_DIR"

          sudo tee \
            "$WIFI_DIR/fh_25f618.nmconnection" \
            > /dev/null <<'EOF'
          [connection]
          id=fh_25f618
          type=wifi
          autoconnect=true
          autoconnect-priority=100

          [wifi]
          mode=infrastructure
          ssid=fh_25f618

          [wifi-security]
          key-mgmt=wpa-psk
          psk=11223344

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          sudo chmod 600 \
            "$WIFI_DIR/fh_25f618.nmconnection"

          echo
          echo "=== WIFI PROFILE ==="
          sudo cat "$WIFI_DIR/fh_25f618.nmconnection"

          echo
          echo "=== WIFI CONFIGURATION: PASS ==="

      # ============================================================
      # 11. BUILD FINAL IMAGE
      # ============================================================
      - name: Build Final Image
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab

          echo
          echo "=== FINAL IMAGE BUILD: PASS ==="

      # ============================================================
      # 12. VERIFY
      # ============================================================
      - name: Verify Build
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"

          echo "=== VERIFY ROOTFS ==="
          test -d "$ROOTFS"
          echo "Rootfs: PASS"

          echo
          echo "=== VERIFY SSH ==="

          if [ -f "$ROOTFS/etc/init.d/sshd" ]; then
            echo "sshd service: PASS"
          else
            echo "ERROR: sshd service not found."
            exit 1
          fi

          echo
          echo "=== VERIFY WIFI ==="

          if [ -f \
            "$ROOTFS/etc/NetworkManager/system-connections/fh_25f618.nmconnection"
          ]; then
            echo "Wi-Fi profile: PASS"
          else
            echo "ERROR: Wi-Fi profile not found."
            exit 1
          fi

          echo
          echo "=== VERIFY HOSTNAME ==="

          if [ -f "$ROOTFS/etc/hostname" ]; then
            cat "$ROOTFS/etc/hostname"
          fi

          echo
          echo "=== IMAGE FILES ==="

          find "$HOME/pmbootstrap-work" \
            -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "*.tar.gz" \) \
            -print

          echo
          echo "=== BUILD VERIFICATION: PASS ==="

      # ============================================================
      # 13. EXPORT
      # ============================================================
      - name: Export postmarketOS Images
        run: |
          rm -rf output
          mkdir -p output

          pmbootstrap export "$HOME/work-export"

          cp -a "$HOME/work-export/." output/

          echo
          echo "=== OUTPUT ==="
          ls -lah output/

      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-whyred-headless-server
          path: output/
          if-no-files-found: error
