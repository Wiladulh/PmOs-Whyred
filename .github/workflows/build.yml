name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:
    inputs: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean

          echo "=== DISK ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            util-linux \
            coreutils \
            kpartx \
            binfmt-support \
            qemu-user-static \
            openssh-client

          echo "=== DEPENDENCIES ==="
          git --version
          python3 --version
          openssl version
          losetup --version
          command -v kpartx

          echo "=== DEPENDENCY CHECK: PASS ==="

      - name: Install Latest pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "=== PMBOOTSTRAP ==="
          pmbootstrap --version

      - name: Clone Official pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git \
            "$HOME/pmaports"

          echo "=== PMAPORTS ==="
          git -C "$HOME/pmaports" branch --show-current

          echo
          echo "=== WHYRED DEVICE CHECK ==="

          if test -d "$HOME/pmaports/device/testing/device-xiaomi-whyred"; then
            echo "PASS: device-xiaomi-whyred exists."
          else
            echo "ERROR: device-xiaomi-whyred not found."

            find "$HOME/pmaports/device" \
              -maxdepth 3 \
              -type d \
              -name "*whyred*" \
              -print

            exit 1
          fi

      - name: Initialize pmbootstrap
        run: |
          PMB_WORK="$HOME/pmbootstrap-work"
          PMB_APORTS="$HOME/pmaports"

          mkdir -p "$PMB_WORK"

          echo "=== PMBOOTSTRAP INIT ==="
          echo "WORK:   $PMB_WORK"
          echo "APORTS: $PMB_APORTS"

          test -d "$PMB_APORTS"
          test -d "$PMB_APORTS/device/testing/device-xiaomi-whyred"

          cd "$HOME"

          yes "" | pmbootstrap \
            --work "$PMB_WORK" \
            --aports "$PMB_APORTS" \
            init

          echo
          echo "=== PMBOOTSTRAP INIT: PASS ==="

      - name: Configure pmbootstrap
        run: |
          PMB_WORK="$HOME/pmbootstrap-work"
          PMB_APORTS="$HOME/pmaports"

          pmbootstrap config work "$PMB_WORK"
          pmbootstrap config aports "$PMB_APORTS"
          pmbootstrap config device xiaomi-whyred
          pmbootstrap config ui console
          pmbootstrap config user giebux
          pmbootstrap config hostname whyred-server
          pmbootstrap config timezone Asia/Jakarta
          pmbootstrap config jobs 4

          pmbootstrap config extra_packages \
            "openssh,networkmanager,wpa_supplicant,iw,util-linux,usbutils,curl"

          pmbootstrap config ssh_keys False

          echo
          echo "=== PMBOOTSTRAP CONFIG ==="
          pmbootstrap config

          echo
          echo "=== CONFIGURATION: PASS ==="

      - name: Build Rootfs
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-image

      - name: Configure Wi-Fi
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"
          WIFI_DIR="$ROOTFS/etc/NetworkManager/system-connections"
          WIFI_FILE="$WIFI_DIR/fh_25f618.nmconnection"

          if test -d "$ROOTFS"; then
            echo "Rootfs found: PASS"
          else
            echo "ERROR: rootfs not found:"
            echo "$ROOTFS"
            exit 1
          fi

          sudo mkdir -p "$WIFI_DIR"

          sudo tee "$WIFI_FILE" > /dev/null <<'EOF'
[connection]
id=fh_25f618
type=wifi
autoconnect=true
autoconnect-priority=100

[wifi]
mode=infrastructure
ssid=fh_25f618

[wifi-security]
key-mgmt=wpa-psk
psk=11223344

[ipv4]
method=auto

[ipv6]
method=auto
EOF

          sudo chmod 600 "$WIFI_FILE"

          echo
          echo "=== WIFI PROFILE ==="

          if sudo test -f "$WIFI_FILE"; then
            echo "Wi-Fi profile: PASS"
          else
            echo "ERROR: Wi-Fi profile not created."
            exit 1
          fi

      - name: Configure USB Networking
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"
          DEVICEINFO="$ROOTFS/usr/share/deviceinfo/deviceinfo"

          echo "=== USB NETWORKING ==="

          if test -d "$ROOTFS"; then
            echo "Rootfs: PASS"
          else
            echo "ERROR: rootfs not found."
            exit 1
          fi

          if test -f "$DEVICEINFO"; then
            echo "deviceinfo: PASS"
          else
            echo "ERROR: deviceinfo not found:"
            echo "$DEVICEINFO"

            find "$ROOTFS/usr/share/deviceinfo" \
              -maxdepth 2 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          sudo sed -i \
            '/^deviceinfo_usb_network_function=/d' \
            "$DEVICEINFO"

          sudo sed -i \
            '/^deviceinfo_usb_server_ip=/d' \
            "$DEVICEINFO"

          sudo sed -i \
            '/^deviceinfo_usb_client_ip=/d' \
            "$DEVICEINFO"

          sudo tee -a "$DEVICEINFO" > /dev/null <<'EOF'

# USB Ethernet Gadget
deviceinfo_usb_network_function="ncm.usb0"
deviceinfo_usb_server_ip="172.16.42.1"
deviceinfo_usb_client_ip="172.16.42.2"
EOF

          echo
          echo "=== USB NETWORK CONFIG ==="
          sudo tail -n 8 "$DEVICEINFO"

          echo
          echo "USB NCM: PASS"
          echo "USB IPv4 server: 172.16.42.1"
          echo "USB IPv4 client: 172.16.42.2"
          echo "IPv6: link-local autoconfiguration preserved"

          echo "=== USB NETWORK CONFIGURATION: PASS ==="

      - name: Build Final Image
        run: |
          pmbootstrap install \
            --password=1234

      - name: Verify Build
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"
          BOOTIMG="$ROOTFS/boot/boot.img"
          WIFI_FILE="$ROOTFS/etc/NetworkManager/system-connections/fh_25f618.nmconnection"
          DEVICEINFO="$ROOTFS/usr/share/deviceinfo/deviceinfo"

          echo "=== VERIFY ROOTFS ==="

          if test -d "$ROOTFS"; then
            echo "Rootfs: PASS"
          else
            echo "ERROR: rootfs not found."
            exit 1
          fi

          echo
          echo "=== VERIFY SSH ==="

          if test -x "$ROOTFS/usr/sbin/sshd"; then
            echo "sshd binary: PASS"
          elif test -x "$ROOTFS/usr/bin/ssh"; then
            echo "ssh client: PASS"
          else
            echo "ERROR: OpenSSH binaries not found."
            exit 1
          fi

          echo
          echo "=== VERIFY WIFI ==="

          if test -f "$WIFI_FILE"; then
            echo "Wi-Fi profile: PASS"
          else
            echo "ERROR: Wi-Fi profile not found."
            exit 1
          fi

          echo
          echo "=== VERIFY USB NETWORK ==="

          if test -f "$DEVICEINFO"; then
            echo "deviceinfo: PASS"

            if grep -q '^deviceinfo_usb_network_function="ncm.usb0"' "$DEVICEINFO"; then
              echo "USB NCM configuration: PASS"
            else
              echo "ERROR: USB NCM configuration not found."
              exit 1
            fi

            if grep -q '^deviceinfo_usb_server_ip="172.16.42.1"' "$DEVICEINFO"; then
              echo "USB server IPv4: PASS"
            else
              echo "ERROR: USB server IPv4 not found."
              exit 1
            fi

            if grep -q '^deviceinfo_usb_client_ip="172.16.42.2"' "$DEVICEINFO"; then
              echo "USB client IPv4: PASS"
            else
              echo "ERROR: USB client IPv4 not found."
              exit 1
            fi
          else
            echo "ERROR: deviceinfo not found."
            exit 1
          fi

          echo
          echo "=== VERIFY BOOT IMAGE ==="

          if test -f "$BOOTIMG"; then
            ls -lh "$BOOTIMG"
            echo "boot.img: PASS"
          else
            echo "ERROR: boot.img not found."
            exit 1
          fi

          echo
          echo "=== VERIFY HOSTNAME ==="

          if test -f "$ROOTFS/etc/hostname"; then
            cat "$ROOTFS/etc/hostname"
          else
            echo "WARNING: hostname file not found."
          fi

          echo
          echo "=== BUILD VERIFICATION: PASS ==="

      - name: Export postmarketOS Images
        run: |
          rm -rf output
          mkdir -p output

          pmbootstrap export "$HOME/work-export"

          cp -a "$HOME/work-export/." output/

          echo
          echo "=== OUTPUT ==="
          ls -lah output/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-whyred-headless-server
          path: output/
          if-no-files-found: error
