name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 03. CLEAN RUNNER
      # ============================================================
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      # ============================================================
      # 04. HOST DEPENDENCIES
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            util-linux \
            coreutils \
            kpartx \
            binfmt-support \
            qemu-user-static \
            openssh-client

          echo "=== DEPENDENCIES ==="
          git --version
          python3 --version
          losetup --version
          command -v kpartx
          echo "=== DEPENDENCY CHECK: PASS ==="

      # ============================================================
      # 05. PMBOOTSTRAP
      # ============================================================
      - name: Install Latest pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "=== PMBOOTSTRAP ==="
          pmbootstrap --version

      # ============================================================
      # 06. PMAPORTS
      # ============================================================
      - name: Clone Official pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git \
            "$HOME/pmaports"

          echo "=== PMAPORTS ==="
          git -C "$HOME/pmaports" branch --show-current

          echo "=== WHYRED DEVICE CHECK ==="

          if [ ! -d "$HOME/pmaports/device/testing/device-xiaomi-whyred" ]; then
            echo "ERROR: device-xiaomi-whyred not found."
            find "$HOME/pmaports/device" \
              -maxdepth 3 \
              -type d \
              -name '*whyred*' \
              -print
            exit 1
          fi

          echo "PASS: device-xiaomi-whyred exists."

      # ============================================================
      # 07. PMBOOTSTRAP CONFIGURATION
      # ============================================================
      - name: Configure pmbootstrap
        run: |
          pmbootstrap -y init

          pmbootstrap config aports "$HOME/pmaports"
          pmbootstrap config device xiaomi-whyred
          pmbootstrap config ui console
          pmbootstrap config user giebux
          pmbootstrap config hostname whyred-server
          pmbootstrap config timezone Asia/Jakarta
          pmbootstrap config jobs 4

          pmbootstrap config extra_packages \
            "openssh,networkmanager,wpa_supplicant,iw,util-linux,usbutils,curl"

          pmbootstrap config ssh_keys False
          pmbootstrap config nonfree_firmware True

          echo
          echo "=== PMBOOTSTRAP CONFIG ==="
          pmbootstrap config

      # ============================================================
      # 08. CREATE ROOTFS ONLY
      # ============================================================
      - name: Build Rootfs
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab \
            --no-image

      # ============================================================
      # 09. CONFIGURE HEADLESS SERVER
      # ============================================================
      - name: Configure Headless Server
        run: |
          ROOTFS="$HOME/.local/var/pmbootstrap/chroot_rootfs_xiaomi-whyred"

          echo "=== ROOTFS ==="
          echo "$ROOTFS"

          if [ ! -d "$ROOTFS" ]; then
            echo "ERROR: rootfs not found."
            exit 1
          fi

          # --------------------------------------------------------
          # SSH
          # --------------------------------------------------------
          sudo mkdir -p "$ROOTFS/etc/ssh"

          if [ -f "$ROOTFS/etc/ssh/sshd_config" ]; then
            sudo sed -i \
              's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' \
              "$ROOTFS/etc/ssh/sshd_config"
          fi

          sudo mkdir -p "$ROOTFS/etc/runlevels/default"

          sudo ln -sf \
            /etc/init.d/sshd \
            "$ROOTFS/etc/runlevels/default/sshd"

          # --------------------------------------------------------
          # NetworkManager
          # --------------------------------------------------------
          sudo ln -sf \
            /etc/init.d/NetworkManager \
            "$ROOTFS/etc/runlevels/default/NetworkManager"

          # --------------------------------------------------------
          # Wi-Fi profile
          # --------------------------------------------------------
          WIFI_DIR="$ROOTFS/etc/NetworkManager/system-connections"

          sudo mkdir -p "$WIFI_DIR"

          sudo tee "$WIFI_DIR/fh_25f618.nmconnection" > /dev/null <<'EOF'
          [connection]
          id=fh_25f618
          type=wifi
          autoconnect=true
          autoconnect-priority=100

          [wifi]
          mode=infrastructure
          ssid=fh_25f618

          [wifi-security]
          key-mgmt=wpa-psk
          psk=11223344

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          sudo chmod 600 \
            "$WIFI_DIR/fh_25f618.nmconnection"

          # --------------------------------------------------------
          # Ensure hostname
          # --------------------------------------------------------
          echo "whyred-server" | \
            sudo tee "$ROOTFS/etc/hostname" > /dev/null

          echo
          echo "=== SSH CONFIG ==="
          sudo grep -E \
            '^(PasswordAuthentication|PermitRootLogin)' \
            "$ROOTFS/etc/ssh/sshd_config" || true

          echo
          echo "=== WIFI PROFILE ==="
          sudo cat "$WIFI_DIR/fh_25f618.nmconnection"

          echo
          echo "=== ENABLED SERVICES ==="
          ls -l "$ROOTFS/etc/runlevels/default/" | \
            grep -E 'sshd|NetworkManager' || true

          echo
          echo "HEADLESS CONFIGURATION: PASS"

      # ============================================================
      # 10. BUILD FINAL IMAGE
      # ============================================================
      - name: Build Final Image
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab

      # ============================================================
      # 11. VERIFY FINAL ROOTFS
      # ============================================================
      - name: Verify Final Image Configuration
        run: |
          ROOTFS="$HOME/.local/var/pmbootstrap/chroot_rootfs_xiaomi-whyred"

          echo "=== VERIFY SSH ==="

          if [ ! -e "$ROOTFS/etc/init.d/sshd" ]; then
            echo "ERROR: sshd service missing."
            exit 1
          fi

          if [ ! -L "$ROOTFS/etc/runlevels/default/sshd" ]; then
            echo "ERROR: sshd service not enabled."
            exit 1
          fi

          echo "SSH: PASS"

          echo
          echo "=== VERIFY NETWORKMANAGER ==="

          if [ ! -e "$ROOTFS/etc/init.d/NetworkManager" ]; then
            echo "ERROR: NetworkManager service missing."
            exit 1
          fi

          echo "NetworkManager: PASS"

          echo
          echo "=== VERIFY WIFI ==="

          if [ ! -f \
            "$ROOTFS/etc/NetworkManager/system-connections/fh_25f618.nmconnection" \
          ]; then
            echo "ERROR: Wi-Fi profile missing."
            exit 1
          fi

          echo "Wi-Fi profile: PASS"

          echo
          echo "=== VERIFY HOSTNAME ==="
          cat "$ROOTFS/etc/hostname"

          echo
          echo "=== FINAL CONFIGURATION: PASS ==="

      # ============================================================
      # 12. EXPORT
      # ============================================================
      - name: Export postmarketOS Images
        run: |
          rm -rf output
          mkdir -p output

          pmbootstrap export "$HOME/work-export"

          cp -a "$HOME/work-export/." output/

          echo
          echo "=== OUTPUT ==="
          ls -lah output/

      # ============================================================
      # 13. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-whyred-headless-server
          path: output/
          if-no-files-found: error
