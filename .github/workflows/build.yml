name: Build postmarketOS Whyred Headless Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 02. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 03. CLEAN RUNNER
      # ============================================================
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      # ============================================================
      # 04. HOST DEPENDENCIES
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            util-linux \
            coreutils \
            kpartx \
            binfmt-support \
            qemu-user-static \
            openssh-client \
            expect

          echo "=== DEPENDENCIES ==="
          git --version
          python3 --version
          losetup --version
          command -v kpartx
          expect -v
          echo "=== DEPENDENCY CHECK: PASS ==="

      # ============================================================
      # 05. PMBOOTSTRAP
      # ============================================================
      - name: Install Latest pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "=== PMBOOTSTRAP ==="
          pmbootstrap --version

      # ============================================================
      # 06. PMAPORTS
      # ============================================================
      - name: Clone Official pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git \
            "$HOME/pmaports"

          echo "=== PMAPORTS ==="
          git -C "$HOME/pmaports" branch --show-current

          echo
          echo "=== WHYRED DEVICE CHECK ==="

          if [ ! -d "$HOME/pmaports/device/testing/device-xiaomi-whyred" ]; then
            echo "ERROR: device-xiaomi-whyred not found."

            find "$HOME/pmaports/device" \
              -maxdepth 3 \
              -type d \
              -name '*whyred*' \
              -print

            exit 1
          fi

          echo "PASS: device-xiaomi-whyred exists."

      # ============================================================
      # 07. NON-INTERACTIVE PMBOOTSTRAP INIT
      # ============================================================
      - name: Initialize pmbootstrap
        env:
          PMB_WORK: ${{ github.workspace }}/pmbootstrap-work
          PMB_APORTS: ${{ github.workspace }}/pmaports
        run: |
          mkdir -p "$PMB_WORK"

          cat > /tmp/pmbootstrap-init.exp <<'EOF'
          #!/usr/bin/expect -f

          set timeout 1200

          set work $env(PMB_WORK)
          set aports $env(PMB_APORTS)

          spawn pmbootstrap \
            --work "$work" \
            --aports "$aports" \
            init

          expect {
            -re {Work path.*:} {
              send "$work\r"
              exp_continue
            }

            -re {pmaports path.*:} {
              send "$aports\r"
              exp_continue
            }

            -re {Channel.*:} {
              send "edge\r"
              exp_continue
            }

            -re {Vendor.*:} {
              send "xiaomi\r"
              exp_continue
            }

            -re {Device codename.*:} {
              send "whyred\r"
              exp_continue
            }

            -re {Username.*:} {
              send "giebux\r"
              exp_continue
            }

            -re {User interface.*:} {
              send "console\r"
              exp_continue
            }

            -re {Extra packages.*:} {
              send "openssh,networkmanager,networkmanager-wifi,networkmanager-cli,wpa_supplicant,iw,util-linux,usbutils,curl\r"
              exp_continue
            }

            -re {Device hostname.*:} {
              send "whyred-server\r"
              exp_continue
            }

            -re {Would you like to copy.*SSH.*keys.*} {
              send "n\r"
              exp_continue
            }

            -re {Build outdated packages.*} {
              send "y\r"
              exp_continue
            }

            -re {Use this timezone instead of GMT.*} {
              send "y\r"
              exp_continue
            }

            -re {Locale.*:} {
              send "en_US\r"
              exp_continue
            }

            -re {Change them.*} {
              send "n\r"
              exp_continue
            }

            -re {Install systemd.*} {
              send "never\r"
              exp_continue
            }

            -re {Provider.*:} {
              send "default\r"
              exp_continue
            }

            eof {
              catch wait result
              set exit_code [lindex $result 3]

              if {$exit_code != 0} {
                exit $exit_code
              }

              exit 0
            }

            timeout {
              puts "ERROR: pmbootstrap init timed out."
              exit 1
            }
          }
          EOF

          chmod +x /tmp/pmbootstrap-init.exp

          /tmp/pmbootstrap-init.exp

          echo
          echo "=== PMBOOTSTRAP INIT: PASS ==="

      # ============================================================
      # 08. APPLY FINAL CONFIGURATION
      # ============================================================
      - name: Configure pmbootstrap
        run: |
          pmbootstrap config aports "$HOME/pmaports"
          pmbootstrap config device xiaomi-whyred
          pmbootstrap config ui console
          pmbootstrap config user giebux
          pmbootstrap config hostname whyred-server
          pmbootstrap config timezone Asia/Jakarta
          pmbootstrap config jobs 4

          pmbootstrap config extra_packages \
            "openssh,networkmanager,networkmanager-wifi,networkmanager-cli,wpa_supplicant,iw,util-linux,usbutils,curl"

          pmbootstrap config ssh_keys False
          pmbootstrap config nonfree_firmware True

          echo
          echo "=== FINAL PMBOOTSTRAP CONFIG ==="
          pmbootstrap config

          echo
          echo "=== CONFIGURATION: PASS ==="

      # ============================================================
      # 09. CREATE ROOTFS ONLY
      # ============================================================
      - name: Build Rootfs
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab \
            --no-image

          echo
          echo "=== ROOTFS BUILD: PASS ==="

      # ============================================================
      # 10. CONFIGURE WIFI + NETWORK SERVICES
      # ============================================================
      - name: Configure Headless Network
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"

          if [ ! -d "$ROOTFS" ]; then
            echo "ERROR: Rootfs not found:"
            echo "$ROOTFS"
            exit 1
          fi

          # --------------------------------------------------------
          # NetworkManager Wi-Fi profile
          # --------------------------------------------------------
          WIFI_DIR="$ROOTFS/etc/NetworkManager/system-connections"

          sudo mkdir -p "$WIFI_DIR"

          sudo tee "$WIFI_DIR/fh_25f618.nmconnection" > /dev/null <<'EOF'
          [connection]
          id=fh_25f618
          type=wifi
          autoconnect=true
          autoconnect-priority=100

          [wifi]
          mode=infrastructure
          ssid=fh_25f618

          [wifi-security]
          key-mgmt=wpa-psk
          psk=11223344

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          sudo chmod 600 \
            "$WIFI_DIR/fh_25f618.nmconnection"

          # --------------------------------------------------------
          # Enable NetworkManager
          # --------------------------------------------------------
          if [ -f "$ROOTFS/etc/init.d/networkmanager" ]; then
            sudo mkdir -p "$ROOTFS/etc/runlevels/default"

            sudo ln -sf \
              /etc/init.d/networkmanager \
              "$ROOTFS/etc/runlevels/default/networkmanager"
          fi

          # --------------------------------------------------------
          # Enable wpa_supplicant
          # --------------------------------------------------------
          if [ -f "$ROOTFS/etc/init.d/wpa_supplicant" ]; then
            sudo mkdir -p "$ROOTFS/etc/runlevels/default"

            sudo ln -sf \
              /etc/init.d/wpa_supplicant \
              "$ROOTFS/etc/runlevels/default/wpa_supplicant"
          fi

          # --------------------------------------------------------
          # Hostname
          # --------------------------------------------------------
          echo "whyred-server" | \
            sudo tee "$ROOTFS/etc/hostname" > /dev/null

          echo
          echo "=== WIFI PROFILE ==="
          sudo cat "$WIFI_DIR/fh_25f618.nmconnection"

          echo
          echo "=== NETWORK SERVICES ==="
          ls -l "$ROOTFS/etc/runlevels/default/" | \
            grep -E 'networkmanager|wpa_supplicant' || true

          echo
          echo "=== NETWORK CONFIGURATION: PASS ==="

      # ============================================================
      # 11. VERIFY SSH
      # ============================================================
      - name: Verify SSH
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"

          if [ ! -f "$ROOTFS/etc/init.d/sshd" ]; then
            echo "ERROR: sshd service not found."
            exit 1
          fi

          if [ ! -L "$ROOTFS/etc/runlevels/default/sshd" ]; then
            echo "ERROR: sshd is not enabled."
            exit 1
          fi

          echo "SSHD: PASS"

      # ============================================================
      # 12. BUILD FINAL IMAGE
      # ============================================================
      - name: Build Final Image
        run: |
          pmbootstrap install \
            --password=1234 \
            --no-fstab

          echo
          echo "=== FINAL IMAGE BUILD: PASS ==="

      # ============================================================
      # 13. VERIFY FINAL CONFIGURATION
      # ============================================================
      - name: Verify Final Configuration
        run: |
          ROOTFS="$HOME/pmbootstrap-work/chroot_rootfs_xiaomi-whyred"

          echo "=== VERIFY HOSTNAME ==="
          cat "$ROOTFS/etc/hostname"

          echo
          echo "=== VERIFY WIFI ==="

          test -f \
            "$ROOTFS/etc/NetworkManager/system-connections/fh_25f618.nmconnection"

          echo "Wi-Fi profile: PASS"

          echo
          echo "=== VERIFY SSH ==="

          test -f "$ROOTFS/etc/init.d/sshd"

          echo "SSH service: PASS"

          echo
          echo "=== VERIFY NETWORKMANAGER ==="

          test -f "$ROOTFS/etc/init.d/networkmanager"

          echo "NetworkManager: PASS"

          echo
          echo "=== VERIFY WHYRED IMAGE ==="

          find "$HOME/pmbootstrap-work" \
            -maxdepth 3 \
            -type f \
            \( -name "*.img" -o -name "*.zip" \) \
            -print

          echo
          echo "=== FINAL VERIFICATION: PASS ==="

      # ============================================================
      # 14. EXPORT
      # ============================================================
      - name: Export postmarketOS Images
        run: |
          rm -rf output
          mkdir -p output

          pmbootstrap export "$HOME/work-export"

          cp -a "$HOME/work-export/." output/

          echo
          echo "=== OUTPUT ==="
          ls -lah output/

      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-whyred-headless-server
          path: output/
          if-no-files-found: error
